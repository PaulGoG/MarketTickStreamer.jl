version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/bench"
      - "/docs"
      - "/examples"
      - "/scripts"
      - "/test"
    schedule:
      interval: "weekly"
    ignore:
      # HTTP.jl stays on 1.x on purpose: 2.x is a rewrite on a new transport,
      # and the migration is planned, not incidental (docs: architecture, §6).
      # A version range, not `update-types`: widening the bound from "1.10"
      # to "1.10, 2.8" is not classed as a major update and slipped through.
      - dependency-name: "HTTP"
        versions: [">= 2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
