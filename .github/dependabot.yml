version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/bench"
      - "/docs"
      - "/examples"
      - "/scripts"
      - "/test"
    schedule:
      interval: "weekly"
    ignore:
      # HTTP.jl stays on 1.x: 2.x is a rewrite on a new transport, and moving
      # to it is a change of its own (docs: architecture, §6). A version range
      # rather than `update-types`, because widening a 1.x bound to admit 2.x
      # is not classed as a major update.
      - dependency-name: "HTTP"
        versions: [">= 2"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
