name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Linux only, deliberately: this is a data-acquisition package targeting
    # Linux hosts, and `[compat]` makes no claim about other platforms.
    # Widening the matrix means first running the suite there — the mock
    # server, the PID-file lock and the raw-layer path handling are the parts
    # that would need it.
    #
    # Every leg blocks the workflow except "pre", which watches the next
    # prerelease. Coverage runs once: it disables package images and roughly
    # doubles the precompile time.
    #
    # The committed manifests are resolved on 1.13 and pin its standard-library
    # membership, which moves between Julia versions — Zstd_jll is a standard
    # library on 1.13 and a registered package on 1.12, so a 1.13 manifest
    # cannot be built on the compat floor. Legs on any other version therefore
    # resolve their own environment, which is what the `julia` compat bound
    # claims anyway; the blocking "1" leg is the one that validates the
    # manifests as committed.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            coverage: true
            experimental: false
            resolve: false
          - version: "1.12"
            coverage: false
            experimental: false
            resolve: true
          - version: "pre"
            coverage: false
            experimental: true
            resolve: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - name: Resolve a fresh environment for this Julia version
        if: matrix.resolve
        run: rm -f Manifest.toml
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add("JuliaFormatter"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # deploydocs pushes docs/build to gh-pages with the workflow token.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
