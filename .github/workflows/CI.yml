name: CI
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    name: Tests — Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    # Linux only: `[compat]` makes no claim about other platforms, and the mock
    # server, the PID-file lock and the raw-layer path handling are untested
    # elsewhere.
    #
    # No manifest is tracked, so every leg resolves its own environment from
    # `[compat]`. Every leg blocks the workflow except "pre". Coverage runs
    # once: it disables package images and roughly doubles the precompile time.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "1"
            coverage: true
            experimental: false
          - version: "1.12"
            coverage: false
            experimental: false
          - version: "pre"
            coverage: false
            experimental: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
        with:
          directories: src,ext
      - uses: codecov/codecov-action@v7
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - run: |
          julia -e 'using Pkg; Pkg.add(name = "JuliaFormatter", version = "2"); using JuliaFormatter;
                    format(".", verbose = false) || error("Formatting check failed: run JuliaFormatter over the repository.")'
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    # deploydocs pushes docs/build to gh-pages with the workflow token.
    permissions:
      contents: write
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - run: julia docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
