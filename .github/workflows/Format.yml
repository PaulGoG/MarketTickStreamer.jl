name: Format
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  format:
    name: JuliaFormatter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      # A check only: nothing is rewritten, and a file that the committed
      # style would change fails the job.
      - name: Check the tree against .JuliaFormatter.toml
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp = true)
          Pkg.add(name = "JuliaFormatter", version = "2")
          using JuliaFormatter
          format("."; overwrite = false) ||
              error("unformatted files: run JuliaFormatter 2 over the repository")
