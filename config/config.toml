# MarketTickStreamer configuration. Credentials come from `.env` (see `.env.example`).

[provider]
name = "alpaca"          # provider adapter; one of: "alpaca"
feed = "delayed_sip"     # live feed; one of: "iex" | "delayed_sip" | "sip"

[stream]
# Symbols to subscribe; at most limits.max_symbols entries
symbols = ["AAPL", "NVDA", "TSLA", "JPM", "ERIE", "SPY"]
channels = ["trades"]            # subset of: "trades" | "quotes" | "bars"
require_market_open = true       # query market clock before connecting; exit if closed
wait_for_open = false            # if closed: sleep until next_open instead of exiting
stop_at_market_close = true      # schedule graceful stop at the session's next_close
reconnect_max_retries = 10       # per-disconnect reconnection attempts before giving up
reconnect_base_delay_s = 1.0     # backoff base [s]; delay = base * 2^attempt, jittered
reconnect_max_delay_s = 60.0     # backoff cap [s]
stale_timeout_s = 120.0          # watchdog: force-reconnect after this frameless interval [s]

[storage]
data_dir = "data"                # relative to project root (absolute paths also accepted)
raw_subdir = "raw"               # append-only NDJSON session files
processed_subdir = "processed"   # compacted per-day, per-symbol files
flush_interval_s = 30.0          # sink flush interval [s]; flushes at interval or max_ticks
flush_max_ticks = 5000           # sink flush batch-size threshold
processed_format = "csv"         # one of: "csv" | "arrow"

[limits]
max_session_hours = 8.0          # hard stop for a live session [h]
max_raw_file_mb = 1024           # roll to a new raw file beyond this size [MB]
channel_capacity = 100000        # in-flight tick buffer; producer blocks when full
max_symbols = 30                 # subscription cap
min_free_disk_gb = 2.0           # refuse to start / stop streaming below this free space [GiB]
max_live_heap_mb = 4096           # live-heap ceiling for backfill/compaction [MiB]; > 0

[replay]
pace = "recorded"                # one of: "recorded" (honor inter-arrival times) | "max"
speed = 1.0                      # time-compression factor when pace = "recorded"; > 0

[backfill]
start_date = "today-2d"          # inclusive exchange date (America/New_York); ISO "YYYY-MM-DD" or "today" / "today-<N>d"
end_date = "today-1d"            # inclusive; >= start_date; same forms; calendar days, not trading days
feed = "sip"                     # historical feed; one of: "iex" | "sip"
page_limit = 10000               # rows per REST page; provider maximum 10000
rate_limit_sleep_s = 0.35        # pause between REST pages [s]
resume = true                    # skip (symbol, day) pairs already present in processed/

[monitor]
# Attach-mode terminal dashboard (scripts/monitor.jl); read-only, opt-in.
refresh_s = 2.0                  # dashboard refresh interval [s]; > 0
top_symbols = 10                 # bar-plot rows; >= 1
rate_window_s = 300.0            # rate-history window [s]; >= refresh_s

[logging]
level = "info"                   # one of: "debug" | "info" | "warn" | "error"
log_to_file = true
log_dir = "logs"                 # relative to project root

[alpaca]
# Endpoint roots — overridable for testing against a mock server.
# trading_base: "https://api.alpaca.markets" (live keys) | "https://paper-api.alpaca.markets" (paper keys)
trading_base = "https://paper-api.alpaca.markets"
data_base = "https://data.alpaca.markets"
ws_base = "wss://stream.data.alpaca.markets/v2"
