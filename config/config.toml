# MarketTickStreamer configuration. Credentials come from `.env` (see `.env.example`).

[provider]
name = "alpaca"          # provider adapter; one of: "alpaca" | "binance"
# Live feed. Valid values depend on the provider:
#   alpaca : "iex" | "delayed_sip" | "sip"
#   binance: "trade" | "aggTrade"
feed = "delayed_sip"

[stream]
# Symbols to subscribe; at most limits.max_symbols entries
symbols = ["AAPL", "NVDA", "TSLA", "JPM", "ERIE", "SPY"]
channels = ["trades"]            # subset of: "trades" | "quotes" | "bars"
require_market_open = true       # require an open market to start
wait_for_open = false            # wait for the next open when closed
stop_at_market_close = true      # stop at the session's close
reconnect_max_retries = 10       # reconnection attempts per disconnect; >= 0
reconnect_base_delay_s = 1.0     # backoff base [s]; > 0
reconnect_max_delay_s = 60.0     # backoff cap [s]; >= reconnect_base_delay_s
stale_timeout_s = 120.0          # watchdog: reconnect after this frameless interval [s]; > 0

[storage]
data_dir = "data"                # data root; relative to project root or absolute
raw_subdir = "raw"               # append-only NDJSON session files
processed_subdir = "processed"   # compacted per-day, per-symbol files
flush_interval_s = 30.0          # sink flush interval [s]; > 0
flush_max_ticks = 5000           # sink flush batch-size threshold; >= 1
processed_format = "csv"         # one of: "csv" | "arrow"

[limits]
max_session_hours = 8.0          # hard stop for a live session [h]; > 0
max_raw_file_mb = 1024           # roll to a new raw file beyond this size [MiB]; >= 1
channel_capacity = 100000        # in-flight tick buffer [ticks]; >= 1
max_symbols = 30                 # subscription cap; >= 1
min_free_disk_gb = 2.0           # minimum free space to start or continue a session [GiB]; >= 0
max_live_heap_mb = 4096          # live-heap ceiling for backfill and compaction [MiB]; > 0

[replay]
pace = "recorded"                # one of: "recorded" | "max"
speed = 1.0                      # time-compression factor when pace = "recorded"; > 0
clock = "auto"                   # pacing timestamp; one of: "auto" | "recv" | "exchange"

[backfill]
# Dates are exchange dates on the provider's calendar (alpaca: America/New_York, binance: UTC).
start_date = "today-2d"          # inclusive start; ISO "YYYY-MM-DD" or "today" / "today-<N>d"
end_date = "today-1d"            # inclusive end; >= start_date; same forms
feed = "sip"                     # historical feed; alpaca: "iex" | "sip"; binance: "aggTrade"
page_limit = 10000               # rows per REST page; 1 to the provider maximum (alpaca 10000, binance 1000)
rate_limit_sleep_s = 0.35        # pause between REST pages [s]; >= 0
resume = true                    # skip (symbol, day) pairs already present in processed/

[quality]
# Sale-condition codes excluded from the price-forming population, by tape
# ("A"/"B": CTA, "C": UTP, "O": OTC).
[quality.non_price_conditions]
A = ["B", "C", "H", "I", "M", "Q", "R", "U", "V", "7", "9"]
B = ["B", "C", "H", "I", "M", "Q", "R", "U", "V", "7", "9"]
C = ["C", "H", "I", "M", "Q", "R", "U", "V", "7", "9"]
O = ["C", "I", "N", "R", "U", "V"]

[monitor]
# Terminal dashboard (scripts/monitor.jl).
refresh_s = 2.0                  # dashboard refresh interval [s]; > 0
top_symbols = 10                 # bar-plot rows; >= 1
rate_window_s = 300.0            # rate-history window [s]; >= refresh_s

[logging]
level = "info"                   # one of: "debug" | "info" | "warn" | "error"
log_to_file = true
log_dir = "logs"                 # relative to project root

[alpaca]
# Endpoint roots — overridable for testing against a mock server.
# trading_base: "https://api.alpaca.markets" (live keys) | "https://paper-api.alpaca.markets" (paper keys)
trading_base = "https://paper-api.alpaca.markets"
data_base = "https://data.alpaca.markets"
ws_base = "wss://stream.data.alpaca.markets/v2"

[binance]
# Endpoint roots — overridable for testing against a mock server.
rest_base = "https://api.binance.com"
ws_base = "wss://stream.binance.com:9443"
